<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Vorislar Lug'ati</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, getDocs, query, where, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCA5bm4Q-dNYKtcXLunK-lKCKqQn_zQDKw",authDomain:"vorislarlugati.firebaseapp.com",projectId:"vorislarlugati",storageBucket:"vorislarlugati.firebasestorage.app",messagingSenderId:"778909193044",appId:"1:778909193044:web:4e3da3eb3a1ec0c64a2ec1"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
const ROLES={1:"👑 Super Admin",2:"🏫 Direktor",3:"👨‍🏫 O'qituvchi",4:"👨‍🎓 O'quvchi"};
const COLORS={1:"#f59e0b",2:"#6366f1",3:"#10b981",4:"#3b82f6"};
let currentUser=null,currentRole=null,currentCenter=null,allUsers=[],centers=[];
onAuthStateChanged(auth,async(u)=>{if(u){const snap=await getDoc(doc(db,"users",u.uid));if(snap.exists()){const d=snap.data();currentUser={uid:u.uid,email:u.email,...d};currentRole=d.role;currentCenter=d.centerId||null;showApp();}else{showMsg("Hisobingiz topilmadi.");await signOut(auth);}}else{currentUser=null;showLogin();}});
async function login(){const email=document.getElementById('email').value.trim();const pass=document.getElementById('pass').value;const btn=document.getElementById('loginBtn');if(!email||!pass)return showErr("Email va parol kiriting");btn.textContent="⏳...";btn.disabled=true;try{await signInWithEmailAndPassword(auth,email,pass);}catch(e){showErr(e.code==='auth/invalid-credential'?"Noto'g'ri email yoki parol":"Xatolik: "+e.message);btn.textContent="🔐 Kirish";btn.disabled=false;}}
function showErr(msg){const e=document.getElementById('err');e.textContent=msg;e.style.display='block';}
async function logout(){await signOut(auth);}
async function loadData(){document.getElementById('loading').style.display='flex';try{const cSnap=await getDocs(collection(db,'centers'));centers=cSnap.docs.map(d=>({id:d.id,...d.data()}));let q;if(currentRole===1)q=collection(db,'users');else if(currentRole===2)q=query(collection(db,'users'),where('centerId','==',currentCenter));else if(currentRole===3)q=query(collection(db,'users'),where('teacherId','==',currentUser.uid));if(q){const uSnap=await getDocs(q);allUsers=uSnap.docs.map(d=>({id:d.id,...d.data()})).filter(u=>u.id!==currentUser.uid);}}catch(e){console.error(e);}document.getElementById('loading').style.display='none';renderUsers();}
function centerName(id){return centers.find(c=>c.id===id)?.name||id||'—';}
function showLogin(){document.getElementById('loginPage').style.display='flex';document.getElementById('appPage').style.display='none';}
function showApp(){document.getElementById('loginPage').style.display='none';document.getElementById('appPage').style.display='block';document.getElementById('roleTag').textContent=ROLES[currentRole];document.getElementById('roleTag').style.color=COLORS[currentRole];document.getElementById('userInfo').textContent=currentUser.name||currentUser.email;if(currentRole>3)document.getElementById('addBtn').style.display='none';loadData();}
function showMsg(msg){document.getElementById('loginPage').style.display='flex';document.getElementById('appPage').style.display='none';showErr(msg);}
function renderUsers(){const list=document.getElementById('userList');const stats=document.getElementById('stats');const d=allUsers.filter(u=>u.role===2).length;const t=allUsers.filter(u=>u.role===3).length;const s=allUsers.filter(u=>u.role===4).length;stats.innerHTML=`<div class="stat"><div class="sn" style="color:#6366f1">${d}</div><div class="sl">Direktorlar</div></div><div class="stat"><div class="sn" style="color:#10b981">${t}</div><div class="sl">O'qituvchilar</div></div><div class="stat"><div class="sn" style="color:#3b82f6">${s}</div><div class="sl">O'quvchilar</div></div>`;if(allUsers.length===0){list.innerHTML='<div class="empty">👥<br>Foydalanuvchilar yo\'q</div>';return;}list.innerHTML=allUsers.map(u=>`<div class="ucard"><div class="uav" style="background:${COLORS[u.role]}22;color:${COLORS[u.role]}">${ROLES[u.role]?.split(' ')[0]}</div><div class="uinfo"><div class="uname">${u.name||'—'}</div><div class="uemail">${u.email}</div><div class="utags"><span class="utag" style="color:${COLORS[u.role]};border-color:${COLORS[u.role]}44">${ROLES[u.role]}</span>${u.centerId?`<span class="utag">${centerName(u.centerId)}</span>`:''}</div></div><button class="delbtn" onclick="delUser('${u.id}')">🗑</button></div>`).join('');}
window.delUser=async function(uid){if(!confirm("O'chirishni tasdiqlaysizmi?"))return;await deleteDoc(doc(db,'users',uid));await loadData();};
window.showAddModal=function(){document.getElementById('modal').style.display='flex';document.getElementById('mErr').style.display='none';document.getElementById('mName').value='';document.getElementById('mEmail').value='';document.getElementById('mPass').value='';const rs=document.getElementById('mRole');rs.innerHTML='';const allowed=currentRole===1?[2,3,4]:currentRole===2?[3,4]:[4];allowed.forEach(r=>{const o=document.createElement('option');o.value=r;o.textContent=ROLES[r];rs.appendChild(o);});const cd=document.getElementById('mCenterDiv');if(currentRole===1&&centers.length>0){cd.style.display='block';const cs=document.getElementById('mCenter');cs.innerHTML='<option value="">— Markaz tanlang —</option>';centers.forEach(c=>{const o=document.createElement('option');o.value=c.id;o.textContent=c.name;cs.appendChild(o);});}else{cd.style.display='none';}};
window.closeModal=function(){document.getElementById('modal').style.display='none';};
window.addUser=async function(){const name=document.getElementById('mName').value.trim();const email=document.getElementById('mEmail').value.trim();const pass=document.getElementById('mPass').value;const role=parseInt(document.getElementById('mRole').value);const centerId=document.getElementById('mCenter')?.value||'';const mErr=document.getElementById('mErr');if(!name||!email||!pass){mErr.textContent="Barcha maydonlar to'ldirilishi shart";mErr.style.display='block';return;}if(pass.length<6){mErr.textContent="Parol kamida 6 ta belgi";mErr.style.display='block';return;}const btn=document.getElementById('saveBtn');btn.textContent="⏳...";btn.disabled=true;try{const res=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${cfg.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pass,returnSecureToken:true})});const data=await res.json();if(data.error)throw new Error(data.error.message);await setDoc(doc(db,'users',data.localId),{name,email,role,centerId:centerId||(currentRole===2?currentCenter:''),teacherId:currentRole===3?currentUser.uid:'',createdBy:currentUser.uid,createdAt:new Date().toISOString()});closeModal();await loadData();}catch(e){mErr.textContent=e.message==='EMAIL_EXISTS'?"Bu email allaqachon ro'yxatdan o'tgan":"Xatolik: "+e.message;mErr.style.display='block';}btn.textContent="✅ Saqlash";btn.disabled=false;};
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('loginBtn').addEventListener('click',login);document.getElementById('pass').addEventListener('keydown',e=>e.key==='Enter'&&login());document.getElementById('logoutBtn').addEventListener('click',logout);document.getElementById('addBtn').addEventListener('click',showAddModal);});
                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                            <style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#07061a;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100dvh}
#loginPage{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:20px}
.lbox{width:100%;max-width:360px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:28px}
.llogo{text-align:center;margin-bottom:24px}
.llogo div:first-child{font-size:36px;margin-bottom:6px}
.llogo .lt{font-size:20px;font-weight:800}
.llogo .ls{font-size:12px;color:rgba(255,255,255,.4);margin-top:3px}
.lbl{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px}
.inp{width:100%;padding:12px 14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.inp:focus{border-color:#6366f1}
#err{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:#f87171;margin-bottom:12px;display:none}
.loginBtn{width:100%;padding:13px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
#appPage{display:none;padding-bottom:20px}
.hdr{padding:16px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
.htitle{font-size:15px;font-weight:800}
.hsub{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
#roleTag{font-size:12px;font-weight:700;margin-top:2px}
.logoutBtn{padding:7px 13px;background:rgba(239,68,68,.2);border:1px solid rgba(239,68,68,.3);border-radius:8px;color:#f87171;font-size:12px;cursor:pointer}
.body{padding:16px}
#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.05);border-radius:12px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,.08)}
.sn{font-size:24px;font-weight:800}
.sl{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sh-t{font-size:14px;font-weight:700}
#addBtn{padding:8px 14px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.ucard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.uav{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.uinfo{flex:1;min-width:0}
.uname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uemail{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.utags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.utag{font-size:10px;padding:2px 8px;border-radius:20px;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.5)}
.delbtn{padding:6px 10px;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.2);border-radius:8px;color:#f87171;font-size:14px;cursor:pointer;flex-shrink:0}
.empty{text-align:center;padding:40px;color:rgba(255,255,255,.3);line-height:2}
#loading{position:fixed;inset:0;background:rgba(7,6,26,.8);display:none;align-items:center;justify-content:center;z-index:100;font-size:24px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:200}
.mbox{width:100%;max-width:480px;background:#0f0e24;border-radius:20px 20px 0 0;padding:24px;border:1px solid rgba(255,255,255,.1)}
.mttl{font-size:16px;font-weight:800;text-align:center;margin-bottom:20px}
#mErr{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:8px 12px;font-size:12px;color:#f87171;margin-bottom:12px;display:none}
select{width:100%;padding:11px 13px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:10px;color:#fff;font-size:14px;outline:none;margin-bottom:12px}
.mbts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.mbtn{padding:12px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;border:none}
.mbtn.cancel{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.15)}
.mbtn.save{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff}
</style>
</head>
<body>
<div id="loginPage">
  <div class="lbox">
    <div class="llogo">
      <div>📚</div>
      <div class="lt">Vorislar Lug'ati</div>
      <div class="ls">Admin panelga kirish</div>
    </div>
    <div id="err"></div>
    <div class="lbl">Email</div>
    <input class="inp" id="email" type="email" placeholder="email@example.com"/>
    <div class="lbl">Parol</div>
    <input class="inp" id="pass" type="password" placeholder="••••••••"/>
    <button class="loginBtn" id="loginBtn">🔐 Kirish</button>
    <div style="margin-top:14px;font-size:11px;color:rgba(255,255,255,.25);text-align:center">Kirish uchun Super Admin tomonidan hisob yaratilishi kerak</div>
  </div>
</div>
<div id="appPage">
  <div id="loading">⏳</div>
  <div class="hdr">
    <div>
      <div class="htitle">👑 Admin Panel</div>
      <div class="hsub" id="userInfo"></div>
      <div id="roleTag"></div>
    </div>
    <button class="logoutBtn" id="logoutBtn">🚪 Chiqish</button>
  </div>
  <div class="body">
    <div id="stats"></div>
    <div class="sh">
      <div class="sh-t">👥 Foydalanuvchilar</div>
      <button id="addBtn">＋ Qo'shish</button>
    </div>
    <div id="userList"></div>
  </div>
</div>
<div id="modal">
  <div class="mbox">
    <div class="mttl">➕ Yangi foydalanuvchi</div>
    <div id="mErr"></div>
    <div class="lbl">Ism Familiya</div>
    <input class="inp" id="mName" placeholder="Abdullayev Jasur"/>
    <div class="lbl">Email</div>
    <input class="inp" id="mEmail" type="email" placeholder="email@example.com"/>
    <div class="lbl">Parol</div>
    <input class="inp" id="mPass" type="password" placeholder="Kamida 6 ta belgi"/>
    <div class="lbl">Rol</div>
    <select id="mRole"></select>
    <div id="mCenterDiv" style="display:none">
      <div class="lbl">O'quv markaz</div>
      <select id="mCenter"></select>
    </div>
    <div class="mbts">
      <button class="mbtn cancel" onclick="closeModal()">Bekor</button>
      <button class="mbtn save" id="saveBtn" onclick="addUser()">✅ Saqlash</button>
    </div>
  </div>
</div>
</body>
</html>
